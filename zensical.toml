# Zensical でこのリポジトリのサイトを作る設定。
#
#   bash tools/build_site.sh
#
# docs_dir が docs/ ではないことに注意する。Zensical は docs_dir の中だけをサイトにする。
# docs/ には ../templates/ や ../standards/ を指すリンクがあるため、
# 書き換えた写しを build/zensical/ に作ってから読ませる。写しは tools/build_site.sh が作る。

[project]
site_name = "システム開発ツール ガイドブック"
site_description = "システム開発で使うツールを、1ツール1文書で説明する"
site_url = "https://ht-0328.github.io/it-tools-guidebook/"
repo_url = "https://github.com/ht-0328/it-tools-guidebook"
repo_name = "ht-0328/it-tools-guidebook"

docs_dir = "build/zensical"
site_dir = "site"

nav = [
  { "ツール一覧" = ["index.md"] },
  { "ツール" = ["zensical.md", "zensical-settings.md"] },
]

[project.theme]
# 日本語にする。全文検索の分かち書きは site language に従うため、ここを ja にする。
language = "ja"
# 書体を外部から読み込まない。生成したサイトから外部への通信を起こさないためである。
font = false
features = [
  "content.code.copy",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

# 明るい表示と暗い表示を切り替える。既定は閲覧環境の設定に従う。
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "明るい表示に切り替える"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "暗い表示に切り替える"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "閲覧環境の設定に戻す"

# 図を描く mermaid を同梱する。読み込み元は build/zensical/assets/ であり、
# 中身は tools/vendor/ の写しである。外部への通信を起こさないため CDN からは読まない。
extra_javascript = ["assets/mermaid.min.js", "assets/mermaid-init.js"]

[project.markdown_extensions]
admonition = {}
# ??? で始めると、たたんだ状態の注意書きになる。
pymdownx.details = {}
attr_list = {}
tables = {}
toc.permalink = true
# 日本語の見出しのアンカーは、既定では _1 _2 のような通し番号になる。
# 0.0.57 で実測して確かめた。見出しの語をそのまま使う slugify を指定して直す。
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }

# ```mermaid を <pre class="mermaid"> にする。描画は mermaid-init.js が行う。
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
